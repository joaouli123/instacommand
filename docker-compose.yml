services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-instacommand}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-instacommand_secret}
      POSTGRES_DB: ${DB_NAME:-instacommand}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-instacommand} -d ${DB_NAME:-instacommand}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://instacommand:instacommand_secret@postgres:5432/instacommand?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-before-production}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      THREADS_REDIRECT_URI: ${THREADS_REDIRECT_URI:-}
      FB_LOGIN_CONFIG_ID: ${FB_LOGIN_CONFIG_ID:-}
      FB_OAUTH_HOST: ${FB_OAUTH_HOST:-m.facebook.com}
      FB_OAUTH_SCOPES: ${FB_OAUTH_SCOPES:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      BACKEND_URL: ${BACKEND_URL:-https://api-instacommand.179.198.98.63.sslip.io}
      FRONTEND_URL: ${FRONTEND_URL:-https://instagram.uxcode.com.br}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://instagram.uxcode.com.br}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FB_REDIRECT_URI: ${FB_REDIRECT_URI:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-this-encryption-key-before-production}
      MEDIA_UPLOAD_DIR: /app/uploads
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-https://api-instacommand.179.198.98.63.sslip.io/uploads}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health | grep -q 'status' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api-instacommand.179.198.98.63.sslip.io}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://api-instacommand.179.198.98.63.sslip.io}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ | grep -q 'InstaCommand' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
