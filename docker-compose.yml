version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: instacommand-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-instacommand}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-instacommand_secret}
      POSTGRES_DB: ${DB_NAME:-instacommand}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-instacommand}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: instacommand-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
